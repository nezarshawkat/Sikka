version: '3.9'
services:
  database:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sikka
    ports:
      - '5432:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - '6379:6379'

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file:
      - ../backend/.env
    ports:
      - '4000:4000'
    depends_on:
      - database
      - redis

  admin_dashboard:
    build:
      context: ../admin_dashboard
      dockerfile: Dockerfile
    ports:
      - '5173:5173'
    depends_on:
      - backend

volumes:
  pg_data:
