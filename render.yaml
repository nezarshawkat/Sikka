services:
  - type: web
    name: sikka-go-api
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @workspace/api-server run build
    startCommand: pnpm --filter @workspace/api-server run start
    healthCheckPath: /api/healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Optional: set this to a self-hosted OSRM instance for production
      # capacity. The backend otherwise uses public OSRM with failover.
      - key: OSRM_DRIVING_URL
        sync: false
      # Optional: Valhalla is an enhancement; OSRM remains the fallback.
      - key: VALHALLA_URL
        sync: false
      # Optional server-only Google Roads key. Enable the Roads API; this is
      # used as an authenticated fallback when public OSRM is unavailable.
      - key: GOOGLE_ROADS_API_KEY
        sync: false
