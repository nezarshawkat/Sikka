apply plugin: 'com.android.application'

def releaseStoreFile = System.getenv("ANDROID_RELEASE_STORE_FILE")
def releaseStorePassword = System.getenv("ANDROID_RELEASE_STORE_PASSWORD")
def releaseKeyAlias = System.getenv("ANDROID_RELEASE_KEY_ALIAS")
def releaseKeyPassword = System.getenv("ANDROID_RELEASE_KEY_PASSWORD")
def releaseSigningValuePresent = { value ->
    value != null && value.toString().trim()
}

def releaseStoreFilePath = null
if (releaseSigningValuePresent(releaseStoreFile)) {
    def releaseStoreFileName = releaseStoreFile.toString().trim()
    def releaseStoreFileCandidates = [
        file(releaseStoreFileName),
        rootProject.file(releaseStoreFileName),
        new File(rootDir.parentFile, releaseStoreFileName)
    ]

    releaseStoreFilePath = releaseStoreFileCandidates.find { it.exists() } ?: releaseStoreFileCandidates[0]
}

def releaseSigningReady = [releaseStoreFile, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every {
    releaseSigningValuePresent(it)
} && releaseStoreFilePath != null && releaseStoreFilePath.exists()

android {
    namespace = "com.sikkago.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "sikka.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 38
        versionName "1.0.37"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        manifestPlaceholders = [
            GOOGLE_MAPS_ANDROID_API_KEY: System.getenv("GOOGLE_MAPS_ANDROID_API_KEY")
                ?: System.getenv("VITE_GOOGLE_MAPS_ANDROID_API_KEY")
                ?: project.findProperty("GOOGLE_MAPS_ANDROID_API_KEY")
                ?: "MISSING_GOOGLE_MAPS_ANDROID_API_KEY"
        ]
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (releaseSigningReady) {
                storeFile releaseStoreFilePath
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            if (releaseSigningReady) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

gradle.taskGraph.whenReady { graph ->
    def releaseTaskRequested = graph.allTasks.any { task ->
        task.path.toLowerCase().contains("bundlerelease") || task.path.toLowerCase().contains("assemblerelease")
    }
    if (releaseTaskRequested && !releaseSigningReady) {
        throw new GradleException("Release signing is missing. Set ANDROID_KEYSTORE_BASE64, ANDROID_RELEASE_STORE_PASSWORD, ANDROID_RELEASE_KEY_ALIAS, and ANDROID_RELEASE_KEY_PASSWORD in GitHub Secrets.")
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // On-device location settings dialog and fused Android settings checks.
    // This makes no Directions or Sikka database requests.
    implementation "com.google.android.gms:play-services-location:21.3.0"
    implementation "com.google.android.gms:play-services-maps:19.2.0"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
