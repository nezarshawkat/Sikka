name: Android Startup Smoke Test
on:
  workflow_dispatch:
  pull_request:
    paths: ['artifacts/sikka/**', 'artifacts/api-server/**', '.github/workflows/android-smoke.yml']
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [29, 35]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.1
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/sikka exec vitest run --config vitest.config.ts
      - run: pnpm --filter @workspace/sikka run build:mobile
      - run: pnpm --filter @workspace/sikka exec cap sync android
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: cd artifacts/sikka/android && chmod +x gradlew && ./gradlew connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke-${{ matrix.api }}
          path: artifacts/sikka/android/app/build/reports/androidTests/
